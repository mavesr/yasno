name: Windows

on:
  push:
    paths: ["windows/**", "Sources/SwitchCore/Resources/**", "Sources/SwitchValidation/Resources/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "Sources/SwitchCore/Resources/**", "Sources/SwitchValidation/Resources/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish release win-v<version> from main (never marked Latest: the Mac updater reads releases/latest)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings -A clippy::style -A clippy::complexity
      - name: Test (detector, engine simulation, Mac corpus, Windows layout tables)
        run: cargo test --release --workspace
      - name: Build x64
        run: cargo build --release -p yasno --target x86_64-pc-windows-msvc
      - name: Self-test on this Windows desktop (hook, SendInput, layouts, edit control)
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/yasno.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "$PWD/self-test.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "self-test timed out" }
          if (Test-Path self-test.txt) { Get-Content self-test.txt } else { Write-Error "no report" }
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed ($($p.ExitCode))" }
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist, release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/yasno.exe dist/Yasno.exe
          Copy-Item ../Sources/SwitchCore/Resources/ATTRIBUTION.md dist/
          Copy-Item ../Sources/SwitchCore/Resources/LICENSE_ru_RU.txt dist/
          Copy-Item ../Sources/SwitchCore/Resources/LICENSE_uk_UA.txt dist/
          Copy-Item ../Sources/SwitchCore/Resources/MPL-1.1.txt dist/
          Copy-Item README.md dist/README.md
          $name = "yasno-$version-x64.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/yasno.exe "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "release/$name.sha256" -Value "$hash  $name"
          Compress-Archive -Path dist/* -DestinationPath "release/Yasno-windows-$version-x64.zip"
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: Yasno-windows-x64
          path: windows/release
      - name: Publish release win-v<version> (not Latest)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "win-v$version"
          $notes = "Ясно для Windows 11 (x64), версия $version. Установка и что нового: windows/README.md. Скачайте yasno-$version-x64.exe и запустите."
          gh release create $tag --repo ${{ github.repository }} --target ${{ github.sha }} --title "Ясно для Windows $version" --notes $notes --latest=false (Get-ChildItem release/*).FullName
          gh release view $tag --repo ${{ github.repository }}
